<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sunrise Dental Clinic</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="login-wrapper">
        <div class="login-banner">
            <div style="color:#fff;font-size:20px;text-align:center;padding:20px;">
                <h2 style="font-size:28px;margin-bottom:10px;">SUNRISE</h2>
                <h3 style="font-size:18px;font-weight:normal;">DENTAL CLINIC</h3>
                <p style="margin-top:20px;font-size:13px;opacity:0.8;">Patient Management System</p>
            </div>
        </div>
        <div class="login-form-area">
            <div class="login-card">
                <h2>LOGIN</h2>
                <div id="alert-box"></div>
                <form id="loginForm">
                    <div class="form-group">
                        <label for="username">Username</label>
                        <input type="text" id="username" placeholder="Enter username" autocomplete="username" required>
                    </div>
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" placeholder="Enter password" autocomplete="current-password" required>
                    </div>
                    <div class="checkbox-group">
                        <input type="checkbox" id="showPassword">
                        <label for="showPassword">Show Password</label>
                    </div>
                    <div class="btn-row">
                        <button type="submit" class="btn btn-primary">Login</button>
                        <button type="button" class="btn btn-secondary" id="clearBtn">Clear</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <script src="js/app.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
