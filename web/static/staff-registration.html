<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Registration - Sunrise Dental Clinic</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="form-page">
        <div class="form-page-banner">
            <div style="color:#fff;font-size:20px;text-align:center;padding:20px;">
                <h2 style="font-size:28px;margin-bottom:10px;">SUNRISE</h2>
                <h3 style="font-size:18px;font-weight:normal;">DENTAL CLINIC</h3>
            </div>
        </div>
        <div class="form-page-content">
            <div class="form-card">
                <h2>Staff Registration</h2>
                <div id="alert-box"></div>
                <form id="staffForm">
                    <div class="form-group">
                        <label for="username">Username</label>
                        <input type="text" id="username" placeholder="Username (min 5 chars)" required>
                    </div>
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" placeholder="Password (min 8 chars)" required>
                    </div>
                    <div class="form-group">
                        <label for="confirmPassword">Confirm Password</label>
                        <input type="password" id="confirmPassword" placeholder="Confirm password" required>
                    </div>
                    <div class="form-group">
                        <label for="role">User Role</label>
                        <select id="role">
                            <option value="Admin">Admin</option>
                            <option value="Receptionist">Receptionist</option>
                            <option value="Doctor">Doctor</option>
                        </select>
                    </div>
                    <div class="checkbox-group">
                        <input type="checkbox" id="showPassword">
                        <label for="showPassword">Show Password</label>
                    </div>
                    <div class="btn-row">
                        <button type="submit" class="btn btn-primary">Register</button>
                        <button type="button" class="btn btn-secondary" onclick="window.location.href='admin.html'">Back</button>
                        <button type="button" class="btn btn-secondary" id="logoutBtn">Logout</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <script src="js/app.js"></script>
    <script src="js/staff-registration.js"></script>
</body>
</html>
