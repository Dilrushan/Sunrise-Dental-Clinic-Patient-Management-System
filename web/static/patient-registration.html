<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Patient - Sunrise Dental Clinic</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="form-page">
        <div class="form-page-banner">
            <div style="color:#fff;font-size:20px;text-align:center;padding:20px;">
                <h2 style="font-size:28px;margin-bottom:10px;">SUNRISE</h2>
                <h3 style="font-size:18px;font-weight:normal;">DENTAL CLINIC</h3>
            </div>
        </div>
        <div class="form-page-content">
            <div class="form-card">
                <h2>Register New Patient</h2>
                <div id="alert-box"></div>
                <form id="patientForm">
                    <div class="form-group">
                        <label for="patientName">Patient Name</label>
                        <input type="text" id="patientName" placeholder="Full name" required>
                    </div>
                    <div class="form-group">
                        <label for="address">Address</label>
                        <input type="text" id="address" placeholder="Patient address">
                    </div>
                    <div class="form-group">
                        <label for="contactNumber">Contact Number</label>
                        <input type="text" id="contactNumber" placeholder="Contact number" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" placeholder="Email address" required>
                    </div>
                    <div class="form-group">
                        <label for="history">Treatment History</label>
                        <input type="text" id="history" placeholder="Previous treatments (optional)">
                    </div>
                    <div class="form-group">
                        <label for="appointmentDate">Appointment Date (YYYY-MM-DD)</label>
                        <input type="text" id="appointmentDate" placeholder="YYYY-MM-DD" required>
                    </div>
                    <div class="form-group">
                        <label for="treatmentType">Treatment Options</label>
                        <select id="treatmentType">
                            <option value="">----------Select Standard Treatment ----------</option>
                            <option value="Routine Teeth Cleaning & Polishing (LKR 1500)">Routine Teeth Cleaning & Polishing (LKR 1500)</option>
                            <option value="Composite Dental Filling (LKR 2500)">Composite Dental Filling (LKR 2500)</option>
                            <option value="Root Canal Treatment (LKR 8000)">Root Canal Treatment (LKR 8000)</option>
                            <option value="Tooth Extraction (LKR 3500)">Tooth Extraction (LKR 3500)</option>
                            <option value="Dental Crown Fitting (LKR 15000)">Dental Crown Fitting (LKR 15000)</option>
                            <option value="General Consultation / Checkup (LKR 0)">General Consultation / Checkup (LKR 0)</option>
                        </select>
                    </div>
                    <div class="btn-row">
                        <button type="submit" class="btn btn-primary">Register Patient</button>
                        <button type="button" class="btn btn-secondary" onclick="APP.redirectByRole(sessionStorage.getItem('role'))">Back</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <script src="js/app.js"></script>
    <script src="js/patient-registration.js"></script>
</body>
</html>
