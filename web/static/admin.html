<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Sunrise Dental Clinic</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="dashboard">
        <div class="dashboard-header">
            <h1>Admin Dashboard - Sunrise Dental Clinic</h1>
            <span id="user-info" style="color:#fff;"></span>
        </div>
        <div class="nav-bar">
            <a href="staff-registration.html" class="btn btn-nav">Register Staff</a>
            <a href="patient-registration.html" class="btn btn-nav">Register Patient</a>
            <a href="booking.html" class="btn btn-nav">Book Appointment</a>
        </div>
        <div id="alert-box"></div>
        <div class="search-bar">
            <label>Search Patient:</label>
            <input type="text" id="searchInput" placeholder="Name or contact...">
            <button class="btn btn-primary" id="searchBtn">Search</button>
            <button class="btn btn-secondary" id="refreshBtn">Refresh</button>
        </div>
        <div class="table-wrapper">
            <table id="appointmentsTable">
                <thead>
                    <tr>
                        <th>Appointment No</th>
                        <th>Patient Name</th>
                        <th>Contact No</th>
                        <th>Doctor ID</th>
                        <th>Date</th>
                        <th>Visit Type</th>
                        <th>Treatment</th>
                        <th>Fee</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
        <div class="nav-bar">
            <button class="btn btn-primary" id="updateBtn">Update Appointment</button>
            <button class="btn btn-danger" id="deleteBtn">Delete Appointment</button>
            <a href="help.html" class="btn btn-secondary">Help</a>
            <button class="btn btn-secondary" id="logoutBtn">Logout</button>
        </div>
    </div>
    <script src="js/app.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
